<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Headphones -->
  <path d="M20 35 C20 25, 30 15, 50 15 C70 15, 80 25, 80 35" 
        fill="none" 
        stroke="currentColor" 
        stroke-width="3" 
        stroke-linecap="round"/>
  
  <!-- Left ear cup -->
  <rect x="15" y="32" width="8" height="12" rx="4" 
        fill="none" 
        stroke="currentColor" 
        stroke-width="3"/>
  
  <!-- Right ear cup -->
  <rect x="77" y="32" width="8" height="12" rx="4" 
        fill="none" 
        stroke="currentColor" 
        stroke-width="3"/>
  
  <!-- Owl head -->
  <circle cx="50" cy="50" r="25" 
          fill="none" 
          stroke="currentColor" 
          stroke-width="3"/>
  
  <!-- Owl ears/horns -->
  <path d="M35 30 L38 22" 
        stroke="currentColor" 
        stroke-width="3" 
        stroke-linecap="round"/>
  <path d="M65 30 L62 22" 
        stroke="currentColor" 
        stroke-width="3" 
        stroke-linecap="round"/>
  
  <!-- Left eye -->
  <circle cx="42" cy="47" r="6" 
          fill="currentColor"/>
  
  <!-- Right eye -->
  <circle cx="58" cy="47" r="6" 
          fill="currentColor"/>
  
  <!-- Beak -->
  <path d="M50 55 L47 62 L53 62 Z" 
        fill="currentColor"/>
  
  <!-- Body -->
  <ellipse cx="50" cy="80" rx="15" ry="10" 
           fill="none" 
           stroke="currentColor" 
           stroke-width="3"/>
  
  <!-- Wing details -->
  <path d="M35 75 Q30 80 35 85" 
        fill="none" 
        stroke="currentColor" 
        stroke-width="2"/>
  <path d="M65 75 Q70 80 65 85" 
        fill="none" 
        stroke="currentColor" 
        stroke-width="2"/>
  
  <!-- Feet -->
  <line x1="45" y1="90" x2="45" y2="95" 
        stroke="currentColor" 
        stroke-width="2"/>
  <line x1="55" y1="90" x2="55" y2="95" 
        stroke="currentColor" 
        stroke-width="2"/>
</svg>